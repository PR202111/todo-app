services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todoflow-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/todoapp.db
      - SECRET_KEY=${SECRET_KEY:-todoflow_production_secret_key_change_me_please}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173}
    volumes:
      - todo-db-data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - todoflow-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').getcode() == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todoflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - todoflow-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  todo-db-data:
    name: todoflow-db-data

networks:
  todoflow-net:
    name: todoflow-network
    driver: bridge
